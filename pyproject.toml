[project]
name = "taskgenie"
version = "0.1.0"
description = "A recursive multi-agent system where managers hire workers by writing role prompts."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
taskgenie = "taskgenie.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taskgenie*"]
